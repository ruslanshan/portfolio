function ledger(p,prices,until){
  const pos={};let inflow=0,outflow=0,income=0,realized=0;const info={};
  const key=(a,l)=>a+'|'+l;
  const add=(a,l,q,c)=>{const k=key(a,l);pos[k]=pos[k]||{asset:a,loc:l,qty:0,cost:0};pos[k].qty+=q;pos[k].cost+=c};
  const rm=(a,l,q)=>{const k=key(a,l);const x=pos[k]||(pos[k]={asset:a,loc:l,qty:0,cost:0});const ratio=x.qty>0?Math.min(1,q/x.qty):0;const c=x.cost*ratio;x.qty-=q;x.cost-=c;return c};
  const txs=p.txs.filter(t=>!until||t.date<=until).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.type==='revalue')-(b.type==='revalue'));
  for(const t of txs){
    const v=num(t.value);
    if(t.type==='buy'){add(t.asset,t.loc,num(t.qty),v);inflow+=v}
    else if(t.type==='income'){add(t.asset,t.loc,num(t.qty),v);income+=v}
    else if(t.type==='sell'){const c=rm(t.asset,t.loc,num(t.qty));realized+=v-c;outflow+=v;info[t.id]={cost:c,realized:v-c}}
    else if(t.type==='swap'){const c=rm(t.asset,t.loc,num(t.qty));add(t.toAsset,t.toLoc||t.loc,num(t.toQty),v);realized+=v-c;info[t.id]={cost:c,realized:v-c}}
    else if(t.type==='borrow'){add(t.asset,t.loc,num(t.qty),v)}
    else if(t.type==='repay'){rm(t.asset,t.loc,num(t.qty))}
    else if(t.type==='transfer'){const c=rm(t.asset,t.loc,num(t.qty));add(t.asset,t.toLoc,num(t.qty)-num(t.fee),c);info[t.id]={cost:c}}
    else if(t.type==='revalue'){const k=key(t.asset,t.loc);const x=pos[k]||(pos[k]={asset:t.asset,loc:t.loc,qty:0,cost:0});x.qty=num(t.value)}
  }
  let value=0,missing=[];
  const list=Object.values(pos).filter(x=>Math.abs(x.qty)>1e-12).map(x=>{const pr=isUsdA(x.asset)?1:prices[x.asset];if(!pr)missing.push(x.asset);const val=x.qty*(pr||0);value+=val;return{...x,price:pr||0,value:val,pnl:val-x.cost}});
  const debt=(p.loans||[]).reduce((a,l)=>a+loanState(p,l,prices,until).debtUsd,0);
  const equity=value-debt;
  return{pos:list,inflow,outflow,income,realized,gross:value,debt,value:equity,net:inflow-outflow,pnl:equity+outflow-inflow,missing:[...new Set(missing)],info};
}
function loanState(p,l,prices,until){
  const end=until||today();
  const ev=[...p.txs.filter(t=>t.loanId===l.id&&(t.type==='borrow'||t.type==='repay')&&t.date<=end).map(t=>({d:t.date,k:t.type,a:num(t.qty)})),...(l.sets||[]).filter(x=>x.d<=end).map(x=>({d:x.d,k:'set',a:num(x.amount)}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const r=num(l.rate)/100;let bal=0,last=null,borrowed=0,repaid=0;
  const grow=(from,to)=>{if(!from||bal<=0)return;const days=(new Date(to)-new Date(from))/864e5;if(days>0)bal*=Math.pow(1+r,days/365)};
  for(const e of ev){grow(last,e.d);if(e.k==='borrow'){bal+=e.a;borrowed+=e.a}else if(e.k==='repay'){bal=Math.max(0,bal-e.a);repaid+=e.a}else bal=e.a;last=e.d}
  grow(last,end);
  const dp=(S.assets[l.debtAsset]&&S.assets[l.debtAsset].stable)?(prices[l.debtAsset]||1):(prices[l.debtAsset]||0);
  const cp=prices[l.collAsset]||0;const cq=num(l.collQty);const collUsd=cq*cp;const debtUsd=bal*dp;const lt=num(l.lt)/100;
  return{bal,debtUsd,collUsd,cp,hf:debtUsd>0.01?collUsd*lt/debtUsd:Infinity,ltv:collUsd>0?debtUsd/collUsd:null,liq:cq>0&&lt>0&&debtUsd>0?debtUsd/(cq*lt):null,interestYear:debtUsd*r,borrowed,repaid,interestAcc:bal-(borrowed-repaid)};
}

function assetStats(p,exclId){const m={};const g=a=>m[a]=m[a]||{bq:0,bu:0,sq:0,su:0,nb:0,ns:0};

  for(const k in m){const x=m[k];x.avgBuy=x.bq>0?x.bu/x.bq:null;x.avgSell=x.sq>0?x.su/x.sq:null}return m}

  if(last&&last.d===e.d)p.snaps[p.snaps.length-1]=e;else p.snaps.push(e);

}
function metrics(p,L){
  const sn=p.snaps.filter(s=>s.v>0).slice().sort((a,b)=>a.d<b.d?-1:1);
  const m={points:sn.length};
  m.totalRet=L.inflow>0?L.pnl/L.inflow:null;
  const z=zones(L);m.stableShare=z.t?z.s/z.t:null;m.yieldShare=z.t?z.y/z.t:null;
  {const sinceY=new Date(Date.now()-30*864e5).toISOString().slice(0,10);const incY=p.txs.filter(t=>t.type==='income'&&t.date>=sinceY&&aZone(t.asset)==='yield').reduce((a,t)=>a+num(t.value),0);m.yieldInc=incY;m.yieldApr=z.y>0?incY*12/z.y:null}
  const locs=byLoc(p,L);m.maxLoc=z.t&&locs.length?locs[0].value/z.t:null;m.maxLocName=locs.length?locName(p,locs[0].loc):'';
  const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const inc30=p.txs.filter(t=>t.type==='income'&&t.date>=since).reduce((s,t)=>s+num(t.value),0);
  m.income30=inc30;m.passiveYield=L.value>0?inc30*12/L.value:null;
  if(p.plan){
    const tot={};L.pos.forEach(x=>{const k=allocKey(p.plan,x.asset);tot[k]=(tot[k]||0)+x.value});
    let d=0;const keys=new Set([...p.plan.alloc.map(a=>a.k),...Object.keys(tot)]);
    keys.forEach(k=>{const t=(p.plan.alloc.find(a=>a.k===k)||{pct:0}).pct/100;const a=L.gross?(tot[k]||0)/L.gross:0;d+=Math.abs(a-t)});
    m.drift=L.gross?d/2:null;
    const need=p.plan.target*12/(S.settings.targetRate/100);m.progress=need?L.value/need:null;m.need=need;
    m.runway=p.plan.target?z.s/p.plan.target:null;
    m.incomeVsTarget=p.plan.target?inc30/p.plan.target:null;
  }
  const al=activeLoans(p).map(l=>({l,st:loanState(p,l,S.prices)})).filter(x=>x.st.debtUsd>0.01);
  if(al.length){m.debt=L.debt;m.lev=L.value>0?L.gross/L.value:null;m.minHf=Math.min(...al.map(x=>x.st.hf));m.intYear=al.reduce((a,x)=>a+x.st.interestYear,0);m.intRate=L.debt?m.intYear/L.debt:null;m.liqRoom=Math.min(...al.filter(x=>x.st.liq&&x.st.cp).map(x=>(x.st.cp-x.st.liq)/x.st.cp));if(!isFinite(m.liqRoom))m.liqRoom=null}
  if(sn.length<2)return m;
  const rets=[];let idx=1,peak=1,mdd=0;const series=[{d:sn[0].d,i:1}];
  for(let i=1;i<sn.length;i++){const a=sn[i-1],b=sn[i];const flow=b.f-a.f;if(a.v<=0)continue;const r=(b.v-flow)/a.v-1;rets.push(r);idx*=1+r;peak=Math.max(peak,idx);mdd=Math.min(mdd,idx/peak-1);series.push({d:b.d,i:idx})}
  const days=(new Date(sn[sn.length-1].d)-new Date(sn[0].d))/864e5;
  m.twr=idx-1;m.days=days;m.mdd=mdd;m.series=series;
  if(days>=30){m.ann=Math.pow(idx,365/days)-1}
  if(rets.length>=3&&days>0){
    const per=365/(days/rets.length);const mean=rets.reduce((s,x)=>s+x,0)/rets.length;
    const sd=Math.sqrt(rets.reduce((s,x)=>s+(x-mean)**2,0)/(rets.length-1));
    const dd=Math.sqrt(rets.reduce((s,x)=>s+Math.min(0,x)**2,0)/rets.length);
    m.vol=sd*Math.sqrt(per);const annR=m.ann??(mean*per);const rf=S.settings.riskFree/100;
    m.sharpe=m.vol>0?(annR-rf)/m.vol:null;m.sortino=dd>0?(annR-rf)/(dd*Math.sqrt(per)):null;
    m.calmar=mdd<0?annR/Math.abs(mdd):null;

  }
  const b0=sn[0].b,b1=sn[sn.length-1].b;if(b0>0&&b1>0){m.btc=b1/b0-1;m.alpha=m.twr-m.btc}
  return m;
}

function tierFor(p,aum){const t=p.fees.tiers.slice().sort((a,b)=>a.from-b.from);let r=t[0];t.forEach(x=>{if(aum>=x.from)r=x});return r}
function mgmtFee(p,aum){
  const k=p.fees.annual?1/12:1;
  if(p.fees.mode==='progressive'){const t=p.fees.tiers.slice().sort((a,b)=>a.from-b.from);let fee=0;t.forEach((x,i)=>{const hi=i<t.length-1?t[i+1].from:Infinity;const part=Math.max(0,Math.min(aum,hi)-x.from);fee+=part*x.mgmt/100});return fee*k}
  return aum*tierFor(p,aum).mgmt/100*k;
}
function feeCalc(p,start,end,flows){
  const profit=end-start-flows;
  const hwmAdj=(p.hwm==null?start:p.hwm)+flows;
  const base=p.fees.hwm?Math.max(0,end-Math.max(start+flows,hwmAdj)):Math.max(0,profit);
  const tier=tierFor(p,end);
  const mf=mgmtFee(p,end);const pf=base*tier.perf/100;
  return{profit,base,mf,pf,total:mf+pf,tier,newHwm:Math.max(hwmAdj,end),ret:start>0?profit/start:null};
}
function flowsIn(p,ym){return p.txs.filter(t=>ymd(t.date)===ym).reduce((s,t)=>s+(t.type==='buy'?num(t.value):t.type==='sell'?-num(t.value):0),0)}

function planCalc(d){
  const cons=S.settings.consRate/100,tr=S.settings.targetRate/100;
  const need=d.target*12/tr;const nowIncome=d.capital*cons/12;const covers=nowIncome>=d.target&&d.target>0;
  const partShare=d.capital>0?need/d.capital:Infinity;
  let months=null;if(d.capital>=need)months=0;else{let v=d.capital;for(let i=1;i<=600;i++){v=v*(1+tr/12)+d.dca;if(v>=need){months=i;break}}}
  return{need,nowIncome,covers,partShare,months,targetIncome:d.capital*tr/12};
}
function recommendModel(d,c){if(!d.withdraw)return'growth';if(c.covers)return'cashflow';return'hybrid'}
function riskProfile(ans){const s=ans.reduce((a,b)=>a+(b||0),0);return{score:s,key:s<=10?'conservative':s<=15?'moderate':'aggressive'}}
function suggestAlloc(profile,model){
  const a={...PROFILES[profile].a};let shift=model==='cashflow'?15:model==='growth'?-10:0;
  const g=a.BTC+a.ETH;shift=Math.max(-(a.STABLES-5),Math.min(shift,g-5));
  const btc=Math.round((a.BTC-shift*a.BTC/g)),eth=Math.round(a.ETH-shift*a.ETH/g);
  return[{k:'BTC',pct:btc},{k:'ETH',pct:eth},{k:'STABLES',pct:100-btc-eth}];
}

/* ===================== ребалансировка ===================== */
const FREQ={none:'Не проводить',month:'Ежемесячно',quarter:'Раз в квартал',half:'Раз в полгода',year:'Раз в год'};
const FREQ_M={month:1,quarter:3,half:6,year:12};
function addMonths(d,n){const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)}
function nextRebal(p){const f=p.rebal.freq;if(!FREQ_M[f])return null;return addMonths(p.rebal.last||p.createdAt||today(),FREQ_M[f])}
function rebalCalc(p,L){
  if(!p.plan)return null;
  const val={};p.plan.alloc.forEach(a=>val[a.k]=0);
  L.pos.forEach(x=>{const k=allocKey(p.plan,x.asset);if(k in val)val[k]+=x.value});
  const total=Object.values(val).reduce((s,v)=>s+v,0);
  const rows=p.plan.alloc.map(a=>{const t=a.pct/100,act=total?val[a.k]/total:0;return{k:a.k,target:t,actual:act,value:val[a.k],diff:t*total-val[a.k],dev:act-t}});
  const band=(num(p.rebal.band)||5)/100;
  const maxDev=rows.reduce((m,r)=>Math.max(m,Math.abs(r.dev)),0);
  const worst=rows.slice().sort((a,b)=>Math.abs(b.dev)-Math.abs(a.dev))[0];
  const next=nextRebal(p);
  const minTrade=Math.max(10,total*0.005);
  const sellers=rows.filter(r=>r.diff<-minTrade).map(r=>({k:r.k,left:-r.diff})).sort((a,b)=>b.left-a.left);
  const buyers=rows.filter(r=>r.diff>minTrade).map(r=>({k:r.k,left:r.diff})).sort((a,b)=>b.left-a.left);
  const trades=[];
  for(const sl of sellers)for(const b of buyers){if(sl.left<1||b.left<1)continue;const amt=Math.min(sl.left,b.left);sl.left-=amt;b.left-=amt;trades.push({from:sl.k,to:b.k,usd:amt})}
  return{rows,total,band,maxDev,worst,next,due:!!next&&next<=today(),outOfBand:total>0&&maxDev>band,trades};
}
function rebalLegs(p,L,trades){
  const rem=L.pos.map(x=>({...x}));const legs=[];
  const exFirst=x=>/бирж/i.test(locKind(p,x.loc))?0:1;
  for(const t of trades){
    let src=rem.filter(x=>x.value>0.5&&(t.from==='STABLES'?S.assets[x.asset]&&S.assets[x.asset].stable:x.asset===t.from)).sort((a,b)=>exFirst(a)-exFirst(b)||b.value-a.value);
    let toAsset=t.to;
    if(t.to==='STABLES'){const st=rem.filter(x=>S.assets[x.asset]&&S.assets[x.asset].stable).sort((a,b)=>b.value-a.value)[0];toAsset=st?st.asset:'USDT'}
    const tp=S.prices[toAsset];if(!tp)continue;
    let need=t.usd;
    for(const x of src){if(need<1)break;const use=Math.min(need,x.value);const q=use/x.price;x.value-=use;x.qty-=q;need-=use;
      legs.push({id:uid(),asset:x.asset,loc:x.loc,qty:q,toAsset,toQty:use/tp,usd:use,on:true})}
  }
  return legs;
}
function dcaHint(p,R){
  if(!p.plan||!p.plan.dca||!R)return[];
  let left=p.plan.dca;const out={};
  const def=R.rows.filter(r=>r.diff>0).sort((a,b)=>b.diff-a.diff);const totDef=def.reduce((s,r)=>s+r.diff,0);
  if(totDef>0){const use=Math.min(left,totDef);def.forEach(r=>out[r.k]=(out[r.k]||0)+use*r.diff/totDef);left-=use}
  if(left>0.5)p.plan.alloc.forEach(a=>out[a.k]=(out[a.k]||0)+left*a.pct/100);
  return Object.entries(out).filter(([,v])=>v>=1).sort((a,b)=>b[1]-a[1]);
}

  let b;try{b=parseBackup(text)}catch(e){return toast('Это не файл резервной копии Рантье')}
  const n=b.data.portfolios.length;
  if(!await ask(`Восстановить данные${b.at?' от '+new Date(b.at).toLocaleString('ru-RU'):''}? В файле ${n} портф. Текущие данные на этом устройстве будут заменены.`,'Восстановить'))return;
  const keepApi=S.settings.api;S=migrate(b.data);W=null;TAB='home';if(!S.settings.api)S.settings.api=keepApi;S.seenVersion=APP_VERSION;save();haptic();toast('Данные восстановлены');
}
async function restoreFromBot(token){
  try{toast('Загружаю файл из чата…');const j=await api('/restore',{token});await restoreFlow(j.json)}
  catch(e){toast('Не удалось получить файл. Перешлите его боту ещё раз.')}
}
function whatsNewHtml(from){

function vHistory(p,L){
  const years=[...new Set(p.txs.map(t=>t.date.slice(0,4)))].sort().reverse();
  const assetsUsed=[...new Set(p.txs.flatMap(t=>[t.asset,t.toAsset]).filter(Boolean))];
  const match=(t,withType)=>(!HF.asset||t.asset===HF.asset||t.toAsset===HF.asset)&&(!HF.loc||t.loc===HF.loc||t.toLoc===HF.loc)&&(!HF.year||t.date.startsWith(HF.year))&&(!withType||HF.type==='all'||(HF.type==='loan'?(t.type==='borrow'||t.type==='repay'):t.type===HF.type));
  if(HF.loc&&!p.locations.some(l=>l.id===HF.loc))HF.loc='';if(HF.asset&&!assetsUsed.includes(HF.asset))HF.asset='';if(HF.year&&!years.includes(HF.year))HF.year='';
  const list=p.txs.filter(t=>match(t,true)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);const base=list;
  const sum=(arr,ty)=>arr.filter(t=>t.type===ty).reduce((a,t)=>a+num(t.value),0);
  const inV=sum(base,'buy'),outV=sum(base,'sell'),incV=sum(base,'income');
  const realV=base.reduce((a,t)=>a+((L.info[t.id]||{}).realized||0),0);
  const active=HF.type!=='all'||HF.asset||HF.loc||HF.year;
  let qIn=0,qOut=0;const A_=HF.asset;const lm=l=>!HF.loc||l===HF.loc;
  if(A_)list.forEach(t=>{const q=num(t.qty);
    if(['buy','income','borrow'].includes(t.type)&&t.asset===A_&&lm(t.loc))qIn+=q;
    else if(['sell','repay'].includes(t.type)&&t.asset===A_&&lm(t.loc))qOut+=q;
    else if(t.type==='swap'){if(t.asset===A_&&lm(t.loc))qOut+=q;if(t.toAsset===A_&&lm(t.toLoc||t.loc))qIn+=num(t.toQty)}
    else if(t.type==='transfer'&&t.asset===A_&&HF.loc){if(t.loc===HF.loc)qOut+=q;if(t.toLoc===HF.loc)qIn+=q-num(t.fee)}});
  const nowQ=A_?L.pos.filter(x=>x.asset===A_&&lm(x.loc)).reduce((a,x)=>a+x.qty,0):0;
  const nowV=A_?L.pos.filter(x=>x.asset===A_&&lm(x.loc)).reduce((a,x)=>a+x.value,0):0;
  const row=(label,val,c,show)=>show?`<span>${label}</span><span class="v ${c||''}">${val}</span>`:'';
  const all=HF.type==='all';
  const LOC=HF.loc;
  const flow=t=>{const v=num(t.value);
    if(!LOC){if(t.type==='buy')return{i:v,o:0,k:'buy'};if(t.type==='sell')return{i:0,o:v,k:'sell'};return null}
    const at=t.loc===LOC,to=(t.toLoc||t.loc)===LOC;
    if(t.type==='buy'&&at)return{i:v,o:0,k:'buy'};
    if(t.type==='sell'&&at)return{i:0,o:v,k:'sell'};
    if(t.type==='transfer'&&at!==to){const c=(L.info[t.id]||{}).cost||0;return at?{i:0,o:c,k:'tout'}:{i:c,o:0,k:'tin'}}
    if(t.type==='swap'&&at!==to)return at?{i:0,o:v,k:'tout'}:{i:v,o:0,k:'tin'};
    return null};
  const F={buy:0,sell:0,tin:0,tout:0};list.forEach(t=>{const f=flow(t);if(f)F[f.k]+=f.i+f.o});
  const locInc=LOC?list.filter(t=>t.type==='income'&&t.loc===LOC).reduce((a,t)=>a+num(t.value),0):0;

  ${ty==='revalue'?`<div class="field"><label>Сколько позиция стоит сейчас (остаток), $</label><input class="inp" inputmode="decimal" name="value" value="${t.value??''}" data-rv></div>`:`<div class="grid2"><div class="field"><label>${isU?'Сумма, $':'Количество'}</label><input class="inp" inputmode="decimal" name="qty" value="${t.qty??''}" placeholder="${isU?'1000':'0.05'}" data-calc="qty"></div>
  ${ty==='swap'||ty==='transfer'||isU?`<input type="hidden" name="price" value="${pr}"><div></div>`:`<div class="field"><label>Цена за 1, $</label><input class="inp" inputmode="decimal" name="price" value="${pr}" data-calc="price"></div>`}</div>
  ${['buy','sell','income'].includes(ty)&&!isU?`<div class="field"><label>Сумма сделки, $</label><input class="inp" inputmode="decimal" name="total" value="${t.total??t.value??''}" data-calc="total" placeholder="сколько вложено или получено"></div>`:''}`}
  <div class="field"><label>${ty==='transfer'?'Откуда':'Площадка'}</label><select class="inp" name="loc" data-newsel="loc">${locOpts(p,t.loc)}</select></div>${newLoc('loc',t.loc)}`;
  if(ty==='swap'){h+=`<div class="grid2"><div class="field"><label>Получаю актив</label><select class="inp" name="toAsset" data-rerender>${assetOpts(t.toAsset||'USDT')}</select></div><div class="field"><label>Количество</label><input class="inp" inputmode="decimal" name="toQty" value="${t.toQty??''}" data-calc="toQty"></div></div>
   ${isDollarA(a0)||isDollarA(t.toAsset||'USDT')?`<input type="hidden" name="value" value="${t.value??''}"><p class="small muted" style="margin:-4px 0 12px">Сумма сделки в $ считается по стейблкоину автоматически.</p>`:`<div class="field"><label>Сумма сделки, $ на дату обмена</label><input class="inp" inputmode="decimal" name="value" value="${t.value??''}" placeholder="если пусто – по текущему курсу" data-calc="value"></div>`}`}
  if(ty==='revalue')h+=rvBlock(p,{...t,asset:a0});
  if(ty==='transfer'){h+=`<div class="field"><label>Куда</label><select class="inp" name="toLoc" data-newsel="toLoc">${locOpts(p,t.toLoc)}</select></div>${newLoc('toLoc',t.toLoc)}<div class="field"><label>Комиссия сети, в штуках актива</label><input class="inp" inputmode="decimal" name="fee" value="${t.fee??''}" placeholder="0"></div>`}
  h+=`${ty==='revalue'||ty==='transfer'||ty==='income'?'':`<div id="txInfo" class="callout teal small" style="margin:0 0 12px;${txInfoHtml({...t,asset:a0,type:ty})?'':'display:none'}">${txInfoHtml({...t,asset:a0,type:ty})}</div>`}<div class="field"><label>Заметка</label><input class="inp" name="note" value="${esc(t.note||'')}" placeholder="необязательно"></div>
  <div class="btns"><button class="btn primary" data-a="saveTx">${t.id?'Сохранить':'Добавить'}</button>${t.id?'<button class="btn danger" data-a="delTx">Удалить</button>':''}</div></form>`;
  return h;
}
function kindOpts(sel){const ks=S.locKinds.includes(sel)||!sel?S.locKinds:[...S.locKinds,sel];return ks.map(k=>`<option ${k===sel?'selected':''}>${esc(k)}</option>`).join('')}
function newLocHtml(p,name,sel,defKind){return`<div class="grid2" data-newloc="${name}" ${sel==='__new'||!p.locations.length?'':'hidden'}><div class="field"><label>Название площадки</label><input class="inp" name="${name}Name" placeholder="Bybit, Aave, Ledger…"></div><div class="field"><label>Тип</label><select class="inp" name="${name}Kind">${kindOpts(defKind&&S.locKinds.includes(defKind)?defKind:S.locKinds[0])}</select></div></div>`}
function readForm(id){const f=$(id);const o={};new FormData(f).forEach((v,k)=>o[k]=v);return o}
function ensureLoc(p,o,field){if(o[field]!=='__new')return o[field];const name=(o[field+'Name']||'').trim();if(!name)return null;const l={id:uid(),name,kind:o[field+'Kind']||'Другое'};p.locations.push(l);return l.id}

/* ===================== Стратегия ===================== */
function vPlan(){
  if(W)return vWizard();
  const p=P();
  if(!p.plan)return`<div class="empty"><div class="big">Стратегия</div><p class="muted">Опросник займёт пару минут: цель по доходу, модель, отношение к риску и пропорции активов.</p><button class="btn primary block" data-a="wizard">Пройти опросник</button></div>`;
  const pl=p.plan;const c=planCalc(pl);
  return`<h2>Цели ${p.owner?'':'клиента'}</h2><div class="card"><div class="kv">
   <span>Сумма, которую хочу извлекать в месяц</span><span class="v">${money(pl.target)}</span>
   <span>Капитал, который для этого нужен (${S.settings.targetRate}% годовых)</span><span class="v">${money(c.need)}</span>
   <span>Капитал на старте</span><span class="v">${money(pl.capital)}</span>
   <span>Сколько он может приносить сейчас (${S.settings.consRate}% годовых)</span><span class="v">${money(c.nowIncome)} в мес.</span>
   <span>Хочу выводить сейчас</span><span class="v">${pl.withdraw?'Да':'Нет'}</span>
   <span>Регулярно инвестирую</span><span class="v">${money(pl.dca)} в мес.</span>
   <span>Цель будет достигнута</span><span class="v">${c.months===0?'уже':c.months?fmtMonths(c.months):'не при таком взносе'}</span>
  </div></div>
  <h2>Модель: ${MODELS[pl.model].t}</h2><p class="muted" style="margin-top:-4px">${MODELS[pl.model].d} Риск-профиль: ${PROFILES[pl.profile].t.toLowerCase()} (${pl.score} из 20).</p>
  ${allocTables(pl)}
  <div class="btns"><button class="btn" data-a="wizard">Пересобрать стратегию</button><button class="btn" data-a="editAlloc">Изменить пропорции</button></div>${vRebal(p)}`;
}
function fmtMonths(m){const y=Math.floor(m/12),mm=m%12;return(y?y+' г. ':'')+(mm?mm+' мес.':'')}
function allocTables(pl){
  const tz=planZones(pl);
  return`<div class="card scroll"><h3 style="margin-bottom:6px">Пропорция активов и покупки по DCA</h3><table class="t"><thead><tr><th>Актив</th><th class="n">Доля</th><th class="n">Каждый месяц</th></tr></thead><tbody>
  ${pl.alloc.map(a=>`<tr><td><span class="dot" style="background:${ZONES[keyZone(a.k)].c}"></span>${esc(keyName(a.k))}</td><td class="n">${nf(1).format(a.pct)}%</td><td class="n">${money(pl.dca*a.pct/100)}</td></tr>`).join('')}
  <tr><td><b>Итого</b></td><td class="n"><b>${nf(1).format(pl.alloc.reduce((s,a)=>s+a.pct,0))}%</b></td><td class="n"><b>${money(pl.dca)}</b></td></tr></tbody></table>
  <h3 style="margin:16px 0 6px">Распределение по зонам</h3><table class="t"><tbody>
  ${ZORDER.map(z=>`<tr><td><span class="dot" style="background:${ZONES[z].c}"></span>${ZONES[z].full}</td><td class="n">${nf(1).format(tz[z]*100)}%</td><td class="n">${money(pl.dca*tz[z])}</td></tr>`).join('')}</tbody></table></div>`;
}
function startWizard(){const p=P();const pl=p.plan;const L=ledger(p,S.prices);
  W={step:0,d:pl?JSON.parse(JSON.stringify(pl)):{target:5000,capital:Math.round(L.value)||0,dca:1000,withdraw:false,model:null,answers:[],alloc:null}};TAB='plan';render();window.scrollTo(0,0)}
function vWizard(){
  const d=W.d;const c=planCalc(d);const steps=`<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div>`;
  if(W.step===0){
    return`${steps}<h2 style="margin-top:8px">Шаг 1. Цель</h2>
    <div class="field"><label>Какую сумму хочу извлекать из капитала в месяц, $</label><input class="inp" inputmode="decimal" data-w="target" value="${d.target}"></div>
    <div class="field"><label>Какой капитал сейчас, $</label><input class="inp" inputmode="decimal" data-w="capital" value="${d.capital}"></div>
    <div class="field"><label>Сколько регулярно инвестирую каждый месяц, $</label><input class="inp" inputmode="decimal" data-w="dca" value="${d.dca}"></div>
    <div class="lbl" style="margin-bottom:6px">Хочу ли выводить сумму в реальную жизнь уже сейчас?</div>
    <div class="seg"><button class="opt" data-a="wset" data-k="withdraw" data-v="1" aria-pressed="${d.withdraw}"><b>Да, выводить сейчас</b></button><button class="opt" data-a="wset" data-k="withdraw" data-v="0" aria-pressed="${!d.withdraw}"><b>Нет, пока растим</b></button></div>
    <div id="wcalc">${wizCalc(d,c)}</div>
    <div class="btns"><button class="btn primary" data-a="wnext">Дальше</button><button class="btn" data-a="wcancel">Отмена</button></div>`;
  }
  if(W.step===1){
    const rec=recommendModel(d,c);if(!d.model)d.model=rec;
    return`${steps}<h2 style="margin-top:8px">Шаг 2. Модель</h2><p class="muted">Рекомендую: <b>${MODELS[rec].t}</b>. ${rec==='cashflow'?'Капитал уже покрывает цель.':rec==='hybrid'?'Вывод нужен сейчас, но капитала пока не хватает на всю сумму – часть выводим, остальное растим.':'Вывод сейчас не нужен – всё работает на рост.'}</p>
    <div class="seg">${Object.entries(MODELS).map(([k,m])=>`<button class="opt" data-a="wset" data-k="model" data-v="${k}" aria-pressed="${d.model===k}"><b>${m.t}</b><span class="small">${m.d}</span></button>`).join('')}</div>
    ${d.model!=='growth'?`<div class="callout teal">Можно выводить сейчас без проедания капитала: ${money(Math.min(d.target,c.nowIncome))} в месяц (${S.settings.consRate}% годовых от ${money(d.capital)}).</div>`:''}
    <div class="btns"><button class="btn primary" data-a="wnext">Дальше</button><button class="btn" data-a="wback">Назад</button></div>`;
  }
  if(W.step===2){
    return`${steps}<h2 style="margin-top:8px">Шаг 3. Отношение к риску</h2>${RISK_Q.map((q,i)=>`<div class="q">${i+1}. ${q.q}</div><div class="seg">${q.o.map((o,j)=>`<button class="opt" style="flex-basis:120px" data-a="wans" data-k="${i}" data-v="${j+1}" aria-pressed="${d.answers[i]===j+1}">${o}</button>`).join('')}</div>`).join('')}
    <div class="btns"><button class="btn primary" data-a="wnext" ${d.answers.filter(Boolean).length<RISK_Q.length?'disabled style="opacity:.5"':''}>Дальше</button><button class="btn" data-a="wback">Назад</button></div>`;
  }
  const r=riskProfile(d.answers);d.profile=r.key;d.score=r.score;
  if(!d.alloc||W.resetAlloc){d.alloc=suggestAlloc(r.key,d.model);W.resetAlloc=false}
  return`${steps}<h2 style="margin-top:8px">Шаг 4. Активы и пропорции</h2>
  <p class="muted">Профиль: <b>${PROFILES[r.key].t}</b> (${r.score} из 20), модель: <b>${MODELS[d.model].t}</b>. Пропорции можно поправить.</p>
  ${allocEditor(d.alloc)}
  <div class="field" style="margin-top:12px"><label>Регулярный взнос в месяц, $</label><input class="inp" inputmode="decimal" data-w="dca" value="${d.dca}"></div>
  ${allocTables(d)}
  <div class="btns"><button class="btn primary" data-a="wfinish">Сохранить стратегию</button><button class="btn" data-a="wback">Назад</button></div>`;
}
function wizCalc(d,c){
  return`<div class="card" style="margin-top:16px"><div class="kv">
   <span>Капитал, чтобы получать ${money(d.target)} в месяц (${S.settings.targetRate}% годовых)</span><span class="v">${money(c.need)}</span>
   <span>Может ли капитал приносить эту сумму сейчас? (${S.settings.consRate}% годовых)</span><span class="v ${c.covers?'up':'down'}">${c.covers?'Да':'Нет'}, ${money(c.nowIncome)}</span>
   <span>Может ли часть капитала приносить цель по ${S.settings.targetRate}%?</span><span class="v">${c.partShare<=1?`Да, ${pct(c.partShare,{dec:0})} капитала`:`Нет, даст ${money(c.targetIncome)}`}</span>
   <span>Когда капитал дорастёт с учётом взносов</span><span class="v">${c.months===0?'уже':c.months?fmtMonths(c.months):'не при таком взносе'}</span>
  </div></div>`;
}
function allocEditor(al){
  const sum=al.reduce((s,a)=>s+num(a.pct),0);
  const keys=['STABLES',...Object.keys(S.assets).filter(k=>!S.assets[k].stable)];
  return`<div class="card">${al.map((a,i)=>`<div class="grid2" style="grid-template-columns:1fr 110px 40px;align-items:center;margin-bottom:8px"><select class="inp" data-al="k" data-i="${i}">${keys.map(k=>`<option value="${k}" ${k===a.k?'selected':''}>${keyName(k)}</option>`).join('')}</select><input class="inp" inputmode="decimal" data-al="pct" data-i="${i}" value="${a.pct}" aria-label="Доля, %"><button class="icon-btn" data-a="alDel" data-i="${i}" aria-label="Убрать">✕</button></div>`).join('')}
  <div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-a="alAdd">Добавить строку</button><button class="btn sm" data-a="addAsset" data-ret="${W?'wizard':'alloc'}">Найти монету</button></span><span class="${Math.abs(sum-100)<0.01?'up':'down'}">Сумма ${nf(1).format(sum)}%</span></div></div>`;
}

  const grade=(x,good,ok)=>x==null?'':x>=good?'up':x>=ok?'':'down';

  h+=`<h2>Доходность</h2><div class="kpis">
   ${k('Прибыль / убыток',money(L.pnl,{sign:true}),'Текущая стоимость плюс выведенное минус вложенное.',cls(L.pnl))}
   ${k('Доходность на вложенное',pct(m.totalRet,{sign:true}),'Прибыль, делённая на все вложенные деньги.',cls(m.totalRet))}
   ${k('Доходность управления (TWR)',pct(m.twr,{sign:true}),'Очищена от пополнений и выводов – показывает качество управления, а не размер взносов.',cls(m.twr))}

   ${k('Коэффициент Сортино',m.sortino!=null?nf(2).format(m.sortino):'–','Как Шарп, но штрафует только падения. Выше 1.5 – хорошо.',grade(m.sortino,1.5,0.7))}
   ${k('Коэффициент Калмара',m.calmar!=null?nf(2).format(m.calmar):'–','Годовая доходность к максимальной просадке. Выше 1 – прибыль окупает худшую просадку.',grade(m.calmar,1,0.5))}

   ${k('Стоимость долга',money(m.intYear)+' в год',`Средняя ставка ${pct(m.intRate)}. Сравните с доходностью, которую приносят заёмные деньги.`,'')}
  </div>`}
  if(m.points<4)h+=`<p class="small muted" style="margin-top:14px">История пишется автоматически раз в день, когда приложение открыто и есть курсы. Риск-метрики станут точными примерно через месяц наблюдений. Сейчас замеров: ${m.points}.</p>`;

function chart(p){
  const sn=p.snaps.filter(s=>s.v>0);
  if(sn.length<2)return`<div class="card muted small">График появится после двух дней наблюдений.</div>`;
  const W_=600,H=220,pad=34;const xs=sn.map(s=>+new Date(s.d));const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  const ymax=Math.max(...sn.map(s=>Math.max(s.v,s.f)))*1.08,ymin=0;
  const X=t=>pad+(t-x0)/(x1-x0||1)*(W_-pad-8),Y=v=>H-24-(v-ymin)/(ymax-ymin||1)*(H-40);
  const line=k=>sn.map((s,i)=>(i?'L':'M')+X(+new Date(s.d)).toFixed(1)+','+Y(s[k]).toFixed(1)).join('');
  const area=line('v')+`L${X(x1)},${Y(0)}L${X(x0)},${Y(0)}Z`;
  const ticks=[0,.5,1].map(f=>ymin+(ymax-ymin)*f);
  return`<div class="chart"><svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="График стоимости портфеля и вложенных средств">
  ${ticks.map(v=>`<line x1="${pad}" x2="${W_-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad-4}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${compact(v)}</text>`).join('')}
  <path d="${area}" fill="var(--gold)" opacity=".14"/><path d="${line('v')}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
  <path d="${line('f')}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${pad}" y="${H-6}" font-size="11" fill="var(--muted)">${new Date(x0).toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})}</text><text x="${W_-8}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${new Date(x1).toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})}</text>
  </svg><div class="small" style="display:flex;gap:16px;margin-top:6px"><span><span class="dot" style="background:var(--gold)"></span>Стоимость</span><span><span class="dot" style="background:var(--teal)"></span>Вложено (чистые пополнения)</span></div></div>`;
}
function compact(v){v*=rate();return Math.abs(v)>=1e6?nf(1).format(v/1e6)+'M':Math.abs(v)>=1e3?nf(0).format(v/1e3)+'k':nf(0).format(v)}

async function fetchT(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function refreshFx(){
  const want=Object.keys(CUR).filter(c=>c!=='USD');
  const sources=[
    async()=>{const j=await fetchT('https://open.er-api.com/v6/latest/USD');if(j.result!=='success'||!j.rates)throw 0;return j.rates},
    async()=>{const j=await fetchT('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');const r={};for(const k in (j.usd||{}))r[k.toUpperCase()]=j.usd[k];return r},
    async()=>{const j=await fetchT('https://latest.currency-api.pages.dev/v1/currencies/usd.json');const r={};for(const k in (j.usd||{}))r[k.toUpperCase()]=j.usd[k];return r}
  ];
  const man=S.settings.fxManual||{};let got=0;
  for(const src of sources){
    try{const r=await src();want.forEach(c=>{if(r[c]>0&&!man[c]){S.settings.fx[c]=+Number(r[c]).toPrecision(6);got++}});if(want.every(c=>man[c]||S.settings.fx[c]>0))break}catch(e){}
  }
  if(got){S.settings.fxAt=Date.now();save({silent:true});return true}
  return false;
}
async function refreshPrices(manual){
  refreshFx().then(ok=>{if(ok){render();if(!$('#sheet').hidden&&$('[data-fx]'))openSettings()}});
  const ids=[...new Set(Object.values(S.assets).map(a=>a.cg).filter(Boolean))];
  try{
    const j=await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`);
    for(const [k,a] of Object.entries(S.assets)){if(a.cg&&j[a.cg]&&j[a.cg].usd){S.prices[k]=j[a.cg].usd;S.chg[k]=j[a.cg].usd_24h_change}}
    S.pricesAt=Date.now();S.pricesSrc='live';save({silent:true});render();if(manual){toast('Курсы обновлены');haptic()}
    if(!$('#sheet').hidden&&$('[data-price]'))openSettings();
  }catch(e){if(manual)toast('Курсы не загрузились. Введите их вручную в настройках.')}
}

  togglePaid:d=>{const r=P().feeRecs.find(x=>x.id===d.k);if(r){r.paid=!r.paid;save()}},
  delFee:async d=>{const p=P();const r=p.feeRecs.find(x=>x.id===d.k);if(!r||!await ask(`Удалить начисление за ${r.period}?`))return;if(p.feeRecs[p.feeRecs.length-1]===r)p.hwm=r.hwmBefore??null;p.feeRecs=p.feeRecs.filter(x=>x!==r);save()},
  report:()=>{const t=reportText(P());openSheet('Отчёт клиенту',`<textarea class="inp" id="rep" style="min-height:260px;font-size:14px">${esc(t)}</textarea><div class="btns"><button class="btn primary" data-a="copyRep">Скопировать</button>${inTG?'<button class="btn" data-a="shareRep">Отправить в Telegram</button>':''}</div>`)},
  copyRep:()=>copy($('#rep').value),
  shareRep:()=>{tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent($('#rep').value))},
  addTab:d=>{const n=$('#cuName');if(n){CU.name=n.value;CU.zone=$('#cuZone').value;const pz=$('#cuPrice');if(pz)CU.price=pz.value}ADD_TAB=d.k;openSheet('Новый актив',addAssetHtml())},
  cuKind:d=>{CU.name=$('#cuName').value;CU.zone=$('#cuZone').value;const pz=$('#cuPrice');if(pz)CU.price=pz.value;CU.kind=d.k;openSheet('Новый актив',addAssetHtml())},
  saveCustom:()=>{const name=cleanName($('#cuName').value);if(!name)return toast('Введите название');if(S.assets[name])return toast(`«${name}» уже есть в списке`);
    const zone=$('#cuZone').value;const kind=CU.kind;let price=1;if(kind==='unit'){price=num(($('#cuPrice')||{}).value);if(!(price>0))return toast('Укажите цену за единицу')}
    S.assets[name]={name,cg:null,stable:false,zone,kind};S.prices[name]=price;S.removedAssets=(S.removedAssets||[]).filter(x=>x!==name);
    CU={name:'',zone:'yield',kind:'usd',price:''};save({silent:true});haptic();toast(`Добавлено: «${name}»`);afterAssetAdded()},
  revalue:d=>{const p=P();const x=ledger(p,S.prices).pos.find(q=>q.asset===d.k&&q.loc===d.loc);openSheet('Переоценка',txForm({type:'revalue',asset:d.k,loc:d.loc,value:x?r2(x.value):''}))},
  addAsset:d=>{ADD_RET=(d&&d.ret)||'settings';SEARCH_Q='';ADD_TAB='coin';openSheet('Новый актив',addAssetHtml());setTimeout(()=>{const i=$('#srQ');i&&i.focus()},60)},
  pickCoin:async d=>{const sym=String(d.sym||'').toUpperCase();if(!sym)return;
    if(S.assets[sym]&&S.assets[sym].cg!==d.id)return toast(`Тикер ${sym} уже занят (${S.assets[sym].name}). Уберите его из списка или добавьте эту монету вручную с другим тикером.`);
    {const st=guessStable(sym,d.name||'');S.assets[sym]={name:d.name||sym,cg:d.id,stable:st,zone:st?'stable':'growth'}}
    S.removedAssets=(S.removedAssets||[]).filter(x=>x!==sym);
    if(S.assets[sym].stable&&!S.prices[sym])S.prices[sym]=1;
    save({silent:true});haptic();toast(`${sym} добавлен`);afterAssetAdded();
    try{const j=await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(d.id)}&vs_currencies=usd&include_24hr_change=true`);if(j[d.id]&&j[d.id].usd){S.prices[sym]=j[d.id].usd;S.chg[sym]=j[d.id].usd_24h_change;S.pricesAt=S.pricesAt||Date.now();save({silent:true});if(!$('#sheet').hidden&&$('[data-price]'))openSettings();else if($('#sheet').hidden)render()}}catch(e){toast(`Курс ${sym} не загрузился – введите его в настройках`)}},
  toggleZone:d=>{const a=S.assets[d.k];if(!a)return;const cur=aZone(d.k);a.zone=ZORDER[(ZORDER.indexOf(cur)+1)%3];save({silent:true});openSettings();toast(`${d.k}: ${ZONES[a.zone].full.toLowerCase()}`)},
  saveAsset:()=>{const k=$('#naSym').value.trim().toUpperCase();if(!k)return toast('Введите тикер');if(S.assets[k])return toast(`${k} уже есть в списке`);S.assets[k]={name:$('#naName').value.trim()||k,cg:null,stable:$('#naSt').value==='1'};S.removedAssets=(S.removedAssets||[]).filter(x=>x!==k);const pr=num($('#naPr').value);if(pr)S.prices[k]=pr;save({silent:true});toast(`${k} добавлен`);afterAssetAdded()},
  delAsset:async d=>{const k=d.k;
    const inTx=S.portfolios.find(p=>p.txs.some(t=>t.asset===k||t.toAsset===k));if(inTx)return toast(`${k} есть в операциях портфеля «${inTx.name}». Сначала удалите эти операции.`);
    const inPlan=S.portfolios.find(p=>p.plan&&p.plan.alloc.some(a=>a.k===k));if(inPlan)return toast(`${k} есть в стратегии «${inPlan.name}». Сначала уберите его из пропорций.`);
    if(!await ask(`Убрать ${k} из списка активов? Его можно будет снова найти и добавить.`,'Убрать'))return openSettings();
    delete S.assets[k];delete S.prices[k];delete S.chg[k];if(DEFAULT_ASSETS[k]&&!S.removedAssets.includes(k))S.removedAssets.push(k);
    save({silent:true});openSettings();toast(`${k} убран`)},
  backup:()=>openSheet('Копия текстом',`<p class="small muted">Скопируйте текст и сохраните в «Избранное» Telegram или в файл.</p><textarea class="inp" id="bk" readonly>${esc(backupJson())}</textarea><div class="btns"><button class="btn primary" data-a="copyBk">Скопировать</button></div>`),
  copyBk:()=>copy($('#bk').value),
  restore:()=>openSheet('Восстановить',`<p class="small muted">Вставьте текст резервной копии. Текущие данные будут заменены.</p><textarea class="inp" id="rs"></textarea><div class="btns"><button class="btn primary" data-a="doRestore">Восстановить</button></div>`),
  doRestore:()=>{const t=$('#rs').value;closeSheet();restoreFlow(t)},
  reset:async()=>{if(!await ask('Стереть все портфели, клиентов и операции?','Стереть'))return;S=defaultState();closeSheet();save();toast('Всё стёрто')},
  wset:d=>{W.d[d.k]=d.k==='withdraw'?d.v==='1':d.v;if(d.k==='model')W.resetAlloc=true;render()},
  wans:d=>{W.d.answers[+d.k]=+d.v;W.resetAlloc=true;render()},
  wnext:()=>{if(W.step===0&&!(W.d.target>0))return toast('Укажите желаемую сумму в месяц');if(W.step===1)W.resetAlloc=true;W.step++;render();window.scrollTo(0,0)},
  wback:()=>{W.step--;render();window.scrollTo(0,0)},
  wcancel:()=>{W=null;TAB='home';render()},
  alAdd:()=>{const al=W?W.d.alloc:P().plan.alloc;const free=['STABLES',...Object.keys(S.assets).filter(k=>!S.assets[k].stable)].find(k=>!al.some(a=>a.k===k));if(!free)return toast('Все активы уже в списке – найдите новую монету');al.push({k:free,pct:0});W?render():A.editAlloc()},
  alDel:d=>{const al=W?W.d.alloc:P().plan.alloc;al.splice(+d.i,1);W?render():A.editAlloc()},
  wfinish:()=>{const d=W.d;if(!P().rebal.last)P().rebal.last=today();const sum=d.alloc.reduce((s,a)=>s+num(a.pct),0);if(Math.abs(sum-100)>0.01)return toast('Сумма долей должна быть 100%');
    const p=P();p.plan={target:num(d.target),capital:num(d.capital),dca:num(d.dca),withdraw:!!d.withdraw,model:d.model,answers:d.answers,profile:d.profile,score:d.score,alloc:d.alloc.map(a=>({k:a.k,pct:num(a.pct)}))};W=null;TAB='home';save();haptic();toast('Стратегия сохранена')},
  editAlloc:()=>{const p=P();openSheet('Пропорции активов',`${allocEditor(p.plan.alloc)}<div class="btns"><button class="btn primary" data-a="saveAlloc">Сохранить</button></div>`)},
  saveAlloc:()=>{const p=P();const sum=p.plan.alloc.reduce((s,a)=>s+num(a.pct),0);if(Math.abs(sum-100)>0.01)return toast('Сумма долей должна быть 100%');closeSheet();save();toast('Пропорции сохранены')}
};
let ASK=null;
function ask(msg,yes){return new Promise(res=>{ASK=res;openSheet('Подтвердите',`<p>${esc(msg)}</p><div class="btns"><button class="btn danger" data-a="askYes">${yes||'Удалить'}</button><button class="btn" data-a="askNo">Отмена</button></div>`)})}
A.askYes=()=>{closeSheet();const r=ASK;ASK=null;r&&r(true)};
A.askNo=()=>{closeSheet();const r=ASK;ASK=null;render();r&&r(false)};
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Скопировано')).catch(()=>{const ta=document.querySelector('#sheet textarea');if(ta){ta.select();try{document.execCommand('copy');toast('Скопировано')}catch(e){toast('Выделите текст и скопируйте вручную')}}})}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset,el)});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')A.closeSheet()});
$('#pfSel').addEventListener('change',e=>{if(e.target.value==='__new'){render();A.newClient()}else{S.activeId=e.target.value;W=null;HF={type:'all',asset:'',loc:'',year:''};save()}});
document.addEventListener('change',e=>{
  const el=e.target;const p=P();
  if(el.dataset.w!==undefined){W.d[el.dataset.w]=num(el.value);render();return}
  if(el.dataset.al){const al=W?W.d.alloc:p.plan.alloc;const a=al[+el.dataset.i];if(el.dataset.al==='k')a.k=el.value;else a.pct=num(el.value);if(W)render();else{save({silent:true});A.editAlloc()}return}
  if(el.dataset.rerender!==undefined){const o=readForm('#txf');if(el.name==='asset'){o.price=S.prices[o.asset]||''}if(el.name==='type'&&o.type==='revalue'&&!isUsdA(o.asset))o.asset=null;openSheet(o.id?'Операция':'Новая операция',txForm(o));return}
  if(el.dataset.newsel&&el.closest('#txf')&&readForm('#txf').type==='revalue'&&el.value!=='__new'){const o=readForm('#txf');o.fund='';openSheet(o.id?'Операция':'Новая операция',txForm(o));return}
  if(el.dataset.newsel){const box=document.querySelector(`[data-newloc="${el.dataset.newsel}"]`);if(box)box.hidden=el.value!=='__new';return}
  if(el.dataset.pf){p[el.dataset.pf]=el.value;save();return}
  if(el.dataset.tier){p.fees.tiers[+el.dataset.i][el.dataset.tier]=num(el.value);save({silent:true});return}
  if(el.dataset.fee){const k=el.dataset.fee;p.fees[k]=k==='mode'?el.value:el.value==='1';save({silent:true});return}
  if(el.dataset.loc){const l=p.locations.find(x=>x.id===el.dataset.k);if(l){l[el.dataset.loc]=el.value;save({silent:true})}return}
  if(el.dataset.set){const k=el.dataset.set;S.settings[k]=(k==='currency'||k==='api')?el.value.trim():num(el.value);save({silent:true});if(k==='currency'||k==='api')openSettings();if(k==='currency'&&S.settings.currency!=='USD'&&!(S.settings.fx[S.settings.currency]>0))refreshFx().then(ok=>{if(ok&&!$('#sheet').hidden)openSettings()});return}
  if(el.dataset.hf){HF[el.dataset.hf]=el.value;render();return}
  if(el.dataset.kind!==undefined){const i=+el.dataset.kind;const old=S.locKinds[i];const n=cleanName(el.value);if(!n||n===old){el.value=old;return}if(S.locKinds.includes(n)){el.value=old;return toast('Такой тип уже есть')}S.locKinds[i]=n;S.portfolios.forEach(x=>x.locations.forEach(l=>{if(l.kind===old)l.kind=n}));save({silent:true});A.locations();return}
  if(el.dataset.lnf!==undefined){const f=$('#lnf');if(f)f.elements.lt.value=defaultLT(el.value);return}
  if(el.dataset.rb){p.rebal[el.dataset.rb]=el.dataset.rb==='band'?num(el.value):el.value;save();return}
  if(el.dataset.leg){const l=LEGS.find(x=>x.id===el.dataset.leg);if(l)l.on=el.checked;return}
  if(el.id==='fileIn'){const f=el.files&&el.files[0];if(!f)return;f.text().then(restoreFlow);return}
  if(el.dataset.fx!==undefined){const c=S.settings.currency;S.settings.fx[c]=num(el.value);S.settings.fxManual=S.settings.fxManual||{};S.settings.fxManual[c]=num(el.value)>0;save({silent:true});openSettings();return}
  if(el.dataset.price){S.prices[el.dataset.price]=num(el.value)||0;S.pricesSrc='manual';S.pricesAt=Date.now();save({silent:true});return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='srQ'){SEARCH_Q=el.value.trim();clearTimeout(SEARCH_T);SEARCH_T=setTimeout(()=>searchCoins(SEARCH_Q),350);return}
  if(el.dataset.w!==undefined&&W&&W.step===0){W.d[el.dataset.w]=num(el.value);const c=$('#wcalc');if(c)c.innerHTML=wizCalc(W.d,planCalc(W.d))}
  if(el.dataset.rv!==undefined&&el.closest('#txf')){const box=$('#rvInfo');if(box)box.innerHTML=rvInfoHtml(P(),readForm('#txf'))}
  if(el.dataset.calc&&el.closest('#txf')){const f=el.closest('#txf').elements;const q=num(f.qty&&f.qty.value),pr=num(f.price&&f.price.value),tot=num(f.total&&f.total.value);
    if(f.total&&(el.dataset.calc==='qty'||el.dataset.calc==='price')&&q>0&&pr>0)f.total.value=r2(q*pr);
    if(el.dataset.calc==='total'&&tot>0){if(q>0)f.price.value=+(tot/q).toPrecision(8);else if(pr>0)f.qty.value=+(tot/pr).toPrecision(8)}
    const box=$('#txInfo');if(box){const html=txInfoHtml(readForm('#txf'));box.innerHTML=html;box.style.display=html?'':'none'}}
  if(el.dataset.cm!==undefined){const p=P();const f=$('#cmf');if(el.dataset.cm==='period'){const o={period:el.value,...monthDefaults(p,el.value)};['start','end','flows'].forEach(k=>f.elements[k].value=o[k])}
    const o=readForm('#cmf');$('#cmPrev').innerHTML=cmPreview(p,feeCalc(p,num(o.start),num(o.end),num(o.flows)))}
});

/* ===================== запуск ===================== */
(function boot(){
  const local=loadLocal();if(local)S=migrate(local);
  if(inTG){try{tg.ready();tg.expand();const apply=()=>{document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light'};apply();tg.onEvent('themeChanged',apply)}catch(e){}}
  const qs=new URLSearchParams(location.search);
  const qApi=qs.get('api');if(qApi&&/^https:\/\//.test(qApi)&&S.settings.api!==qApi){S.settings.api=qApi;if(local)save({silent:true})}
  const restoreToken=qs.get('restore');
  if(local&&!S.fix152){let n=0;S.portfolios.forEach(p=>p.txs.forEach(t=>{if(t.type==='swap'&&(isDollarA(t.asset)||isDollarA(t.toAsset))){const v=swapValue(t);if(v>0&&Math.abs(v-num(t.value))>0.01){t.value=v;n++}}}));S.fix152=true;if(n){S.fixCount=n}save({silent:true})}
  if(!local){S.seenVersion=APP_VERSION;S.fix152=true;startWizard()}else render();
  if(restoreToken&&inTG&&apiUrl())restoreFromBot(restoreToken);
  else if(local&&S.seenVersion!==APP_VERSION){const from=S.seenVersion;S.seenVersion=APP_VERSION;save({silent:true});openSheet('Что нового',(S.fixCount?`<div class="callout teal">Пересчитано обменов со стейблкоинами: ${S.fixCount}. Средние цены теперь верные.</div>`:'')+whatsNewHtml(from||'1.0.0'));S.fixCount=0}
  refreshPrices(false);
  initCloud();
  setInterval(()=>refreshPrices(false),5*60*1000);
})();
</script>
